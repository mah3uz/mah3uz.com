# Your settings. Nibble ships defaults for everything not listed here, so keep this file short:
# what you set, you maintain. See site/README.md for what goes where, and the docs for every key.
default: &default
  # The release whose behaviour this site uses. When a release changes something your site would notice, the change
  # arrives switched off; set this to that release's version to switch it on, after reading its changelog entry.
  # Upgrading never changes this line, so an upgrade alone never changes how the site behaves.
  load_defaults: "0.25.0"
  theme: neat
  url: https://mah3uz.com
  locales:
    - code: en
      default: true
      url_prefix: ""
  # Calls the site makes on its own. The Photography page is imported from the Unsplash API by a scheduled task
  # (site/schema/tasks/unsplash-photos.yml); the access key is a secret, set as NIBBLE_SECRET_UNSPLASH_ACCESS_KEY
  # or in credentials under nibble.secrets.unsplash_access_key — never in this file.
  outbound:
    allowed_hosts: [api.unsplash.com]
    secrets: [unsplash_access_key]

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

