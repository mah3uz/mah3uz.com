title: Photos from Unsplash
description: My 30 most-viewed photographs on unsplash.com/@mah3uz, with their statistics, for the Photography page.
schedule: every 12 hours
fetch:
  use: unsplash
  path: /users/mah3uz/photos?per_page=30&order_by=views&stats=true
  into:
    collection: photos
    items: "{response}"
    key: unsplash_id
    # A photo taken down from Unsplash, or no longer in the top 30, is unpublished here too.
    unpublish_missing: true
    map:
      unsplash_id: "{item.id}"
      title: "{item.alt_description}"
      description: "{item.description}"
      page_url: "{item.links.html}"
      image: "{item.urls.regular}"
      image_raw: "{item.urls.raw}"
      width: "{item.width}"
      height: "{item.height}"
      color: "{item.color}"
      blur_hash: "{item.blur_hash}"
      likes: "{item.likes}"
      views: "{item.statistics.views.total}"
      downloads: "{item.statistics.downloads.total}"
      uploaded: "{item.created_at}"
