schema: 1
title: Photo
tabs:
  main:
    display: Photo
    sections:
      - fields:
          - handle: title
            field: { type: text, required: true, listable: true }
          - handle: description
            field: { type: textarea, instructions: "A sentence or two: where, when, what caught the eye." }
          - handle: body
            field:
              type: markdown
              instructions: "The photo itself, as Markdown: ![What it shows](the-photo.jpg) — put the file beside this one."
  details:
    display: Details
    sections:
      - fields:
          - handle: location
            field: { type: text, width: 50 }
          - handle: taken
            field: { type: text, width: 50, instructions: "Month and year, e.g. March 2025." }
          - handle: camera
            field: { type: text, width: 50 }
          - handle: unsplash
            field: { type: text, input_type: url, width: 50, instructions: "The photo's page on Unsplash." }
          - handle: tags
            field: { type: list }
  seo:
    display: SEO
    sections:
      - fields:
          - import: nibble::seo
