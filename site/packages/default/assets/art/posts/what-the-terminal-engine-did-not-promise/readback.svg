<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<defs>
<linearGradient id="dg-rb-bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0A1A20"/><stop offset="1" stop-color="#0D2A31"/></linearGradient>
<radialGradient id="dg-rb-glow" cx="770" cy="480" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#21BDB0" stop-opacity="0.34"/><stop offset="1" stop-color="#21BDB0" stop-opacity="0"/></radialGradient>
<linearGradient id="dg-rb-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62EDD4"/><stop offset="0.55" stop-color="#21BDB0"/><stop offset="1" stop-color="#1388A6"/></linearGradient>
<linearGradient id="dg-rb-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#62EDD4" stop-opacity="0"/><stop offset="0.5" stop-color="#62EDD4"/><stop offset="1" stop-color="#62EDD4" stop-opacity="0"/></linearGradient>
<pattern id="dg-rb-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#62EDD4" fill-opacity="0.12"/></pattern>
<filter id="dg-rb-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#dg-rb-bg)"/>
<rect width="1600" height="1000" fill="url(#dg-rb-dots)"/>
<rect width="1600" height="1000" fill="url(#dg-rb-glow)"/>
<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">Never send a snapshot you can't read</text><rect x="110" y="205" width="270" height="110" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="245.0" y="251" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">authoritative</text><text x="245.0" y="293" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">terminal</text><polyline points="380,260 632,260" fill="none" stroke="#62EDD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 260L632 270L632 250Z" fill="#62EDD4"/><text x="515" y="240" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" text-anchor="middle" fill="#A6D3D6">encode snapshot</text><rect x="650" y="215" width="240" height="90" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="770.0" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">bytes held</text><polyline points="770,305 770,412" fill="none" stroke="#62EDD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 430L760 412L780 412Z" fill="#62EDD4"/><text x="796" y="378" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">decode into a throwaway terminal</text><path d="M770 430L930 520L770 610L610 520Z" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.6" stroke-width="2" stroke-linejoin="round"/><text x="770" y="531" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">reads back?</text><polyline points="930,520 1112,520" fill="none" stroke="#62EDD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1130 520L1112 530L1112 510Z" fill="#62EDD4"/><text x="1020" y="502" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#62EDD4">yes</text><rect x="1130" y="472" width="320" height="96" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.8" stroke-width="2"/><text x="1290.0" y="532" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">send to window</text><polyline points="770,610 770,676" fill="none" stroke="#FF7A6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 694L760 676L780 676Z" fill="#FF7A6B"/><text x="792" y="662" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#FF7A6B">no</text><rect x="600" y="694" width="340" height="110" rx="18" fill="#0E2B33" stroke="#FF7A6B" stroke-opacity="0.6" stroke-width="2"/><text x="770.0" y="740" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">redraw a terminal</text><text x="770.0" y="782" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">from the replay</text><polyline points="940,749 982,749" fill="none" stroke="#FF7A6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1000 749L982 759L982 739Z" fill="#FF7A6B"/><rect x="1000" y="704" width="320" height="90" rx="18" fill="#0E2B33" stroke="#FF7A6B" stroke-opacity="0.6" stroke-width="2"/><text x="1160.0" y="761" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">send that instead</text><text x="600" y="856" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">loses links, prompt marks, hidden screen</text>
</svg>
