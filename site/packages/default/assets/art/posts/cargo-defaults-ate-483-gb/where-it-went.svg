<rect width="1600" height="1000" fill="url(#dg-ww-glow)"/>
<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">Where 483 GB went</text><text x="110" y="330" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">target/debug</text><text x="1490" y="330" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="end" fill="#FF7A6B">483 GB</text><rect x="110" y="360" width="1070" height="140" rx="12" fill="#FF7A6B" fill-opacity="0.9"/><text x="647" y="441.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">376 GB</text><text x="110" y="548" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#A6D3D6">deps</text><rect x="1184" y="360" width="182" height="140" rx="12" fill="#21BDB0" fill-opacity="0.9"/><text x="1277" y="441.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">65 GB</text><text x="1184" y="548" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#A6D3D6">examples</text><rect x="1370" y="360" width="119" height="140" rx="12" fill="#1388A6" fill-opacity="0.9"/><text x="1431" y="441.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#E9F7F7">43 GB</text><text x="1490" y="592" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" text-anchor="end" fill="#A6D3D6">incremental</text><text x="110" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" fill="#E9F7F7">136 integration-test binaries, each 1–1.7 GB,</text><text x="110" y="736" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">about half of it debug info</text>
</svg>
