<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<defs>
<linearGradient id="dg-io-bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0A1A20"/><stop offset="1" stop-color="#0D2A31"/></linearGradient>
<radialGradient id="dg-io-glow" cx="500" cy="520" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#21BDB0" stop-opacity="0.34"/><stop offset="1" stop-color="#21BDB0" stop-opacity="0"/></radialGradient>
<linearGradient id="dg-io-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62EDD4"/><stop offset="0.55" stop-color="#21BDB0"/><stop offset="1" stop-color="#1388A6"/></linearGradient>
<linearGradient id="dg-io-back" x1="0" y1="740" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#62EDD4"/><stop offset="1" stop-color="#21BDB0"/></linearGradient>
<linearGradient id="dg-io-flap" x1="1574" y1="974" x2="1392" y2="792" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A6D3D6"/><stop offset="0.5" stop-color="#E9F7F7"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="dg-io-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#62EDD4" stop-opacity="0"/><stop offset="0.5" stop-color="#62EDD4"/><stop offset="1" stop-color="#62EDD4" stop-opacity="0"/></linearGradient>
