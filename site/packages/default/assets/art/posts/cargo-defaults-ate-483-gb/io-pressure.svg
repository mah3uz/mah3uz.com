<rect width="1600" height="1000" fill="url(#dg-io-dots)"/>
<rect width="1600" height="1000" fill="url(#dg-io-glow)"/>
<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">It wasn't the CPU</text><path d="M260 760.0H1080" stroke="#62EDD4" stroke-opacity="0.6" stroke-width="2"/><text x="236" y="771.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="end" fill="#A6D3D6">0%</text><path d="M260 635.0H1080" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="236" y="646.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="end" fill="#A6D3D6">10%</text><path d="M260 510.0H1080" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="236" y="521.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="end" fill="#A6D3D6">20%</text><path d="M260 385.0H1080" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="236" y="396.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="end" fill="#A6D3D6">30%</text><path d="M260 260.0H1080" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="236" y="271.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="end" fill="#A6D3D6">40%</text><text x="110" y="216" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">pressure stall, "full", during a build</text><rect x="320" y="498" width="180" height="262.5" rx="10" fill="#FF7A6B" fill-opacity="0.85"/><rect x="320" y="422" width="180" height="71.0" rx="12" fill="none" stroke="#FF7A6B" stroke-width="2" stroke-dasharray="10 8"/><text x="410" y="400.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#FF7A6B">21–27%</text><text x="410" y="808" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">io</text><rect x="600" y="754" width="180" height="6" rx="3" fill="#A6D3D6" fill-opacity="0.7"/><text x="690" y="738.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#A6D3D6">≈ 0</text><text x="690" y="808" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">cpu</text><rect x="880" y="754" width="180" height="6" rx="3" fill="#A6D3D6" fill-opacity="0.7"/><text x="970" y="738.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#A6D3D6">≈ 0</text><text x="970" y="808" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">memory</text><text x="1150" y="330" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">"full": the share of time</text><text x="1150" y="372" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">every non-idle task</text><text x="1150" y="414" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">was stalled at once</text><text x="110" y="890" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">links wrote ~1.3 GB every 2 s</text><text x="510" y="890" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" fill="#A6D3D6">· /proc/pressure/io</text>
</g>
