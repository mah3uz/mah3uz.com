<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">Half of every test binary was debug info</text><text x="110" y="236" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#E9F7F7">Sysman · app binary</text><rect x="110" y="258" width="962" height="50" rx="12" fill="#FF7A6B" fill-opacity="0.9"/><rect x="1076" y="258" width="174" height="50" rx="12" fill="none" stroke="#FF7A6B" stroke-width="2" stroke-dasharray="10 8"/><text x="1266" y="294.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#FF7A6B">540–640 MB</text><rect x="110" y="318" width="78" height="50" rx="12" fill="#62EDD4" fill-opacity="0.9"/><text x="204" y="354.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#62EDD4">44 MB</text><text x="110" y="426" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#E9F7F7">Darwan · largest test binary</text><rect x="110" y="448" width="253" height="50" rx="12" fill="#A6D3D6" fill-opacity="0.75"/><text x="130" y="484.0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" fill="#043040">code</text><rect x="367" y="448" width="247" height="50" rx="12" fill="#FF7A6B" fill-opacity="0.9"/><text x="387" y="484.0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" fill="#043040">debug info 49%</text><text x="630" y="484.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#FF7A6B">283 MB</text><rect x="110" y="508" width="162" height="50" rx="12" fill="#62EDD4" fill-opacity="0.9"/><text x="288" y="544.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#62EDD4">91 MB</text><text x="110" y="616" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#E9F7F7">Quarry · largest binary</text><rect x="110" y="638" width="467" height="50" rx="12" fill="#FF7A6B" fill-opacity="0.9"/><text x="593" y="674.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#FF7A6B">262 MB</text><rect x="110" y="698" width="119" height="50" rx="12" fill="#62EDD4" fill-opacity="0.9"/><text x="245" y="734.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#62EDD4">67 MB</text><text x="110" y="846" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" fill="#A6D3D6">debug = "line-tables-only"</text><text x="110" y="890" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" fill="#A6D3D6">[profile.dev.package."*"] debug = false</text>
