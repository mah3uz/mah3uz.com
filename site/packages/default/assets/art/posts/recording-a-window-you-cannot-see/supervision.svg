<rect width="1600" height="1000" fill="url(#dg-sv-glow)"/>
<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">If the daemon dies, so does the recorder</text><rect x="110" y="200" width="400" height="100" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="310.0" y="262" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">easyshot daemon</text><rect x="110" y="440" width="850" height="280" rx="26" fill="none" stroke="#A6D3D6" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="14 10"/><text x="140" y="692" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">process group</text><rect x="140" y="500" width="340" height="120" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="310.0" y="571" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">/bin/sh watcher</text><rect x="510" y="500" width="420" height="120" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="720.0" y="571" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">gpu-screen-recorder</text><polyline points="310,300 310,482" fill="none" stroke="#62EDD4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 500L300 482L320 482Z" fill="#62EDD4"/><text x="336" y="350" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">holds the write end of a pipe</text><text x="336" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">the watcher reads it</text><rect x="1030" y="200" width="440" height="92" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="1250.0" y="258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">pipe closes (EOF)</text><polyline points="1250,292 1250,338" fill="none" stroke="#62EDD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1250 356L1240 338L1260 338Z" fill="#62EDD4"/><rect x="1030" y="356" width="440" height="92" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="1250.0" y="414" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#E9F7F7">SIGINT to the group</text><polyline points="1250,448 1250,592" fill="none" stroke="#62EDD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10"/><path d="M1250 610L1240 592L1260 592Z" fill="#62EDD4"/><text x="1276.0" y="540" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" fill="#62EDD4">10 s</text><rect x="1030" y="610" width="440" height="92" rx="18" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.8" stroke-width="2"/><text x="1250.0" y="667" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#E9F7F7">SIGKILL</text><text x="110" y="830" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" fill="#E9F7F7">PR_SET_PDEATHSIG</text><path d="M104 820H404" stroke="#FF7A6B" stroke-width="3" stroke-linecap="round"/><text x="424" y="830" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">— dropped on exec of a binary with file capabilities</text>
</svg>
