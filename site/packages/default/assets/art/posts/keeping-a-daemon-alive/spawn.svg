<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">Restoring 1,000 panes</text><path d="M360 210V420" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="360" y="460" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="middle" fill="#A6D3D6">0 s</text><path d="M654 210V420" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="654" y="460" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="middle" fill="#A6D3D6">10 s</text><path d="M948 210V420" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="948" y="460" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="middle" fill="#A6D3D6">20 s</text><path d="M1241 210V420" stroke="#62EDD4" stroke-opacity="0.12" stroke-width="2"/><text x="1241" y="460" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" text-anchor="middle" fill="#A6D3D6">30 s</text><path d="M360 420H1340" stroke="#A6D3D6" stroke-opacity="0.6" stroke-width="2"/><text x="110" y="266" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">fork + exec</text><rect x="360" y="226" width="588" height="62" rx="12" fill="#1388A6" fill-opacity="0.9"/><rect x="948" y="226" width="352" height="62" rx="12" fill="#1388A6" fill-opacity="0.35" stroke="#1388A6" stroke-width="2" stroke-dasharray="10 8"/><text x="1124" y="268" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#E9F7F7">20–32 s</text><text x="110" y="356" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">posix_spawn</text><rect x="360" y="316" width="29" height="62" rx="8" fill="#62EDD4"/><text x="407" y="358" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#62EDD4">~1 s</text><text x="110" y="548" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#A6D3D6">per pane</text><text x="110" y="612" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">fork + exec</text><rect x="360" y="578" width="540" height="46" rx="10" fill="#1388A6" fill-opacity="0.9"/><text x="918" y="612" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">18 ms</text><text x="110" y="682" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">posix_spawn</text><rect x="360" y="648" width="90" height="46" rx="10" fill="#62EDD4"/><text x="468" y="682" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#62EDD4">3 ms</text><text x="110" y="800" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">fork copies the memory map;</text><text x="110" y="844" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">its cost grows with the daemon's threads (one per pane)</text>
