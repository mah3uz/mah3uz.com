<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<defs>
<linearGradient id="dg-ho-bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0A1A20"/><stop offset="1" stop-color="#0D2A31"/></linearGradient>
<radialGradient id="dg-ho-glow" cx="500" cy="480" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#21BDB0" stop-opacity="0.34"/><stop offset="1" stop-color="#21BDB0" stop-opacity="0"/></radialGradient>
<linearGradient id="dg-ho-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62EDD4"/><stop offset="0.55" stop-color="#21BDB0"/><stop offset="1" stop-color="#1388A6"/></linearGradient>
<linearGradient id="dg-ho-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#62EDD4" stop-opacity="0"/><stop offset="0.5" stop-color="#62EDD4"/><stop offset="1" stop-color="#62EDD4" stop-opacity="0"/></linearGradient>
<pattern id="dg-ho-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#62EDD4" fill-opacity="0.12"/></pattern>
<filter id="dg-ho-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#dg-ho-bg)"/>
<rect width="1600" height="1000" fill="url(#dg-ho-dots)"/>
<rect width="1600" height="1000" fill="url(#dg-ho-glow)"/>
<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">Upgrading in place: same process, new program</text><rect x="110" y="190" width="900" height="650" rx="28" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.5" stroke-width="2"/><text x="150" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" fill="#62EDD4">pid 4211</text><text x="320" y="252" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="#E9F7F7">— every pane's parent</text><path d="M110 282H1010" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><path d="M180 334V760" stroke="#62EDD4" stroke-opacity="0.3" stroke-width="3"/><circle cx="180" cy="323" r="24" fill="#21BDB0"/><text x="180" y="334" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">1</text><text x="230" y="334" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">write state to an unnamed file</text><circle cx="180" cy="399" r="24" fill="#21BDB0"/><text x="180" y="410" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">2</text><text x="230" y="410" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">ask the new binary: can you read it?</text><text x="230" y="450" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">(isc carried, 10 s)</text><circle cx="180" cy="513" r="24" fill="#21BDB0"/><text x="180" y="524" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">3</text><text x="230" y="524" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">finish in-flight sends (up to 10 s)</text><circle cx="180" cy="589" r="24" fill="#62EDD4"/><text x="180" y="600" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">4</text><text x="230" y="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">exec — fd number in</text><text x="520" y="600" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#62EDD4">INSENSICAL_HANDOVER</text><circle cx="180" cy="665" r="24" fill="#21BDB0"/><text x="180" y="676" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">5</text><text x="230" y="676" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">new daemon checks the fd,</text><text x="230" y="716" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">clears the variable before any thread</text><circle cx="180" cy="779" r="24" fill="#62EDD4"/><text x="180" y="790" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#043040">6</text><text x="230" y="790" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">panes carry on</text><rect x="1080" y="340" width="400" height="170" rx="18" fill="none" stroke="#FF7A6B" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="14 10"/><text x="1110" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#FF7A6B">Rejected:</text><text x="1110" y="434" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">passing descriptors</text><text x="1110" y="474" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">to a new process</text>
</svg>
