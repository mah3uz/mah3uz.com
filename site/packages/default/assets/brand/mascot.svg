<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mah3uz: a cheerful teal keyboard keycap wearing headphones, smiling with a sideways 3">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="16" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15434E"/>
      <stop offset="1" stop-color="#0A1A20"/>
    </linearGradient>
    <radialGradient id="mz-glow" cx="256" cy="270" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21BDB0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#21BDB0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mz-skirt" x1="0" y1="170" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A9FB3"/>
      <stop offset="1" stop-color="#0F5F78"/>
    </linearGradient>
    <linearGradient id="mz-top" x1="0" y1="128" x2="0" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AF5E2"/>
      <stop offset="0.55" stop-color="#3FD3C2"/>
      <stop offset="1" stop-color="#21BDB0"/>
    </linearGradient>
    <linearGradient id="mz-dish" x1="0" y1="140" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mz-cup" x1="0" y1="226" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A5560"/>
      <stop offset="1" stop-color="#0E2B33"/>
    </linearGradient>
    <filter id="mz-shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- the app-icon squircle, like Nibble, Quarry and Sysman -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#mz-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#mz-glow)"/>
  <path class="mz-spark" d="M92 112l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#62EDD4" fill-opacity="0.75"/>
  <path class="mz-spark" d="M424 92l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#A6D3D6" fill-opacity="0.65"/>
  <circle cx="438" cy="170" r="5" fill="#62EDD4" fill-opacity="0.5"/>
  <circle cx="74" cy="196" r="4" fill="#A6D3D6" fill-opacity="0.5"/>

  <!-- shadow on the desk -->
  <ellipse cx="256" cy="452" rx="150" ry="16" fill="#000" fill-opacity="0.45" filter="url(#mz-shadow)"/>

  <g class="mz-body">
    <!-- the keycap's skirt -->
    <path d="M150 168H362Q398 168 404 204L420 392Q424 436 380 436H132Q88 436 92 392L108 204Q114 168 150 168Z" fill="url(#mz-skirt)"/>
    <path d="M132 436H380Q424 436 420 392L418 372Q410 404 372 404H140Q102 404 94 372L92 392Q88 436 132 436Z" fill="#043040" fill-opacity="0.3"/>

    <!-- the top, where the face lives -->
    <rect x="132" y="128" width="248" height="248" rx="54" fill="url(#mz-top)"/>
    <path d="M186 140H326Q366 140 368 180Q330 160 256 160Q182 160 144 180Q146 140 186 140Z" fill="url(#mz-dish)"/>
    <rect x="132" y="128" width="248" height="248" rx="54" fill="none" stroke="#E9F7F7" stroke-opacity="0.35" stroke-width="3"/>

    <!-- the legend, as on a real key -->
    <path d="M160 202V170L174 188L188 170V202" fill="none" stroke="#0F5F78" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- eyes -->
    <g class="mz-eyes">
      <ellipse cx="206" cy="262" rx="32" ry="36" fill="#FFFFFF"/>
      <ellipse cx="306" cy="262" rx="32" ry="36" fill="#FFFFFF"/>
      <g class="mz-pupils">
        <circle cx="210" cy="268" r="21" fill="#043040"/>
        <circle cx="310" cy="268" r="21" fill="#043040"/>
        <circle cx="201" cy="257" r="8" fill="#FFFFFF"/>
        <circle cx="301" cy="257" r="8" fill="#FFFFFF"/>
        <circle cx="217" cy="277" r="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
        <circle cx="317" cy="277" r="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
      </g>
    </g>

    <!-- cheeks -->
    <ellipse cx="166" cy="314" rx="20" ry="12" fill="#FF7D9C" fill-opacity="0.8"/>
    <ellipse cx="346" cy="314" rx="20" ry="12" fill="#FF7D9C" fill-opacity="0.8"/>

    <!-- the smile is a sideways 3 -->
    <path d="M232 318Q244 336 256 318Q268 336 280 318" fill="none" stroke="#043040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- headphones -->
    <path d="M116 270C104 54 408 54 396 270" fill="none" stroke="#0E2B33" stroke-width="22" stroke-linecap="round"/>
    <path d="M124 240C116 80 396 80 388 240" fill="none" stroke="#62EDD4" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
    <rect x="94" y="226" width="50" height="96" rx="24" fill="url(#mz-cup)" stroke="#62EDD4" stroke-opacity="0.6" stroke-width="4"/>
    <rect x="108" y="248" width="10" height="52" rx="5" fill="#62EDD4" fill-opacity="0.85"/>
    <rect x="368" y="226" width="50" height="96" rx="24" fill="url(#mz-cup)" stroke="#62EDD4" stroke-opacity="0.6" stroke-width="4"/>
    <rect x="394" y="248" width="10" height="52" rx="5" fill="#62EDD4" fill-opacity="0.85"/>
  </g>
</svg>
