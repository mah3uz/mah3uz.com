title: Insensical
tagline: A terminal multiplexer with a native window, for running many terminals and coding agents — and knowing which one
  needs you.
description: Insensical is a terminal multiplexer for Linux and macOS built around a daemon that owns every program, so closing
  the window stops nothing and upgrading it loses nothing. It works out the state of every pane — running, waiting, done,
  failed — so when you run several coding agents at once, you know which one is waiting on you.
