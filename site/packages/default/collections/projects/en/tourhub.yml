body: "## TourHub\n\nTourHub was founded by touring audio veterans who were tired of the industry running on group chats,\
  \ handshake deals\nand unpaid invoices. Hiring a touring crew used to mean Facebook groups, personal networks and reputation\
  \ by hearsay;\npayment was a bank transfer with no protection; and excellent crew were invisible outside their own circle.\n\
  \nTourHub replaces that with one platform for crew and the teams that hire them, across Australia. It is preparing to\n\
  launch at [tourhub.io](https://tourhub.io), with more than 2,400 professionals already on the waitlist.\n\n## What the platform\
  \ does\n\n- **Find exactly who a show needs.** Crew are searchable by discipline — tour and road management, production,\
  \ stage\n  management, audio, lighting, video, rigging, backline, wardrobe, logistics, merchandising and more — by gear\n\
  \  proficiency, and by verified tier.\n- **Reputation that is earned.** Crew climb from *Road Rookie* to *Road Legend* as\
  \ they complete verified contracts,\n  and every profile is reviewed by the TourHub team before it appears in search.\n\
  - **Paid before the show.** A hire becomes a contract, and the crew member's payment is secured through Stripe before\n\
  \  they pack their kit. If something goes wrong, disputes are resolved by TourHub's team, not left to whoever chases\n \
  \ hardest.\n- **Built for the road.** It installs like an app and sends push notifications, because the people using it\
  \ are\n  rarely at a desk.\n\n## The engagement\n\nThe work spans both halves of what I do. On the engineering side, that\
  \ means building the product in **Ruby on\nRails** with **Inertia**: the marketplace, profiles and verification, contracts\
  \ and Stripe payments. On the operations\nside, it means the environments those features travel through: a staging environment\
  \ that mirrors production closely\nenough to be trusted, and a production platform people will rely on while they're on\
  \ tour.\n\n- **Staging that tells the truth.** A staging environment is only useful if it behaves like production — same\n\
  \  configuration shape, same kind of data, same deploy process. Every change is reviewed there before it ships.\n- **Money\
  \ handled carefully.** Payments are the part of a marketplace that can't be approximately right. They get the\n  most testing,\
  \ the clearest records and the most conservative changes.\n- **Small, frequent releases.** Small changes are easy to reason\
  \ about, easy to verify and easy to roll back.\n\nThe specifics of client work stay with the client. If you're building\
  \ a platform that needs both careful engineering and\na steady hand on its infrastructure, [let's talk](/about#contact)."
