title: Quarry
tagline: A fast SQL client and full-screen TUI for PostgreSQL, MySQL, MariaDB and SQLite — one binary, the same keys everywhere.
description: Quarry is a native SQL client for the terminal, written in Rust. It pairs a REPL in the tradition of pgcli and
  mycli with a full-screen interface for exploring schemas, editing tables safely and reading query plans, and it is built
  on the assumption that one day you will be connected to production by mistake.
