seo:
  description: 'tide, redesigned: my fork of a self-hosted Go and LiveKit video meeting service, with a new light and dark
    interface, an installable app, a screen-share popout and safer chat.'
body: "## tide\n\n[tide](https://github.com/Convex-Works/tide) is an open-source, self-hosted video meeting service by Convex\
  \ Works: one\nGo binary that embeds a SvelteKit web app and the LiveKit media server. Meeting links, a guest lobby with\
  \ host controls,\nscreen sharing, chat, and optional recording to S3-compatible storage — run it with a single `docker run`,\
  \ or add sign-in\nthrough any OIDC provider.\n\nIt is a good foundation: small, honest about what it does, and easy to host.\
  \ My fork keeps all of that and gives it a new\nface.\n\n## A redesign, end to end\n\nCalm, small and precise. I rebuilt\
  \ the interface on a design language of my own, written down as a contract the code is\nchecked against:\n\n- **Two themes,\
  \ one layout.** Light and dark share every component; only the token values differ. The theme follows the\n  system, a toggle\
  \ overrides it, and it is applied before the first paint, so it never flashes.\n- **Semantic tokens, enforced.** Every colour,\
  \ radius, shadow and duration is a named CSS custom property. The build\n  fails on any `var(--x)` that is used but never\
  \ defined — because CSS drops an undefined variable silently.\n- **The Orbit stage.** The latest speaker fills the *lens*;\
  \ everyone else, you included, is a *portal* around it. A grid\n  view lays everyone out evenly. On a phone the lens fills\
  \ the width and the portals scroll in a strip beneath it; side\n  panels are sheets that dock beside the stage on wide screens\
  \ and become bottom sheets on small ones.\n- **State in the chrome, not in toasts.** A two-pixel hairline across the top\
  \ of the app is the status channel: the brand\n  gradient when connected, amber while reconnecting, grey when offline, pulsing\
  \ red while recording.\n- **Motion with rules.** Only transform and opacity animate; nothing loops unless live state drives\
  \ it; nothing animates\n  in a hidden tab; reduced motion turns it all off.\n- Roboto and JetBrains Mono, self-hosted; icon-first\
  \ controls with tooltips; roles as words, not badges.\n\n## What I added\n\nUpstream deliberately freezes its feature list.\
  \ The fork adds a few things, each kept small:\n\n- **An installable app.** A web manifest and a service worker that caches\
  \ the app shell — and never an API call, the\n  signalling path or any media.\n- **A screen-share popout.** A share can\
  \ be lifted out into a small window of its own, using Document Picture-in-Picture\n  where the browser has it, the browser's\
  \ own picture-in-picture or presentation mode where it doesn't, or an ordinary\n  resizable window on the desktop.\n- **Minimal\
  \ markdown in chat**, parsed to data and rendered as components, so no message can inject markup. Links must be\n  bare,\
  \ so with guests in the room a link always shows where it goes.\n- **Images in chat**, off unless the server enables them.\
  \ The sender's browser re-encodes each image, dropping metadata\n  such as its location; images travel browser to browser\
  \ over the media server's data channel, are held only in memory,\n  and vanish with the meeting. Receivers check the format\
  \ and dimensions, and limits on size, rate and memory bound what\n  one sender can make everyone else hold.\n- **Deployment\
  \ on Dokploy**, with tide behind Traefik and media still reaching it directly over UDP.\n\n## Staying a good fork\n\nA fork\
  \ that can't take its upstream's fixes is a liability. Fork-only work lives in new files; each upstream document\ncarries\
  \ a single pointer line to the fork's own notes; and updates are merged, never rebased, so taking a new upstream\nrelease\
  \ stays a routine merge."
