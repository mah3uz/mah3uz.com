title: tide
tagline: 'A redesign of tide, the self-hosted video meeting service: a new interface in light and dark, an installable app,
  a screen-share popout and safer chat — on top of a Go and LiveKit core.'
description: My fork of tide, an open-source, self-hosted video meeting service from Convex Works. I redesigned its whole
  interface around a new meeting stage, added an installable app, a screen-share popout and carefully bounded chat features,
  and keep it in step with upstream.
