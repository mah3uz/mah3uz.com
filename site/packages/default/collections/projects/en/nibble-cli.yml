title: Nibble CLI
tagline: Start a Nibble site, run its tasks, and work on any site's content from the terminal — as you, and never as more
  than you.
description: The command-line companion to Nibble, written in Rust. It installs new sites with checksum verification, runs
  a site's tasks, and works on the content of any Nibble site you sign in to. Its remote commands are generated from the site
  itself, so a new capability on the server needs no new CLI.
