seo:
  description: Nibble CLI is a Rust command-line tool that creates Nibble sites and edits any site's content through its own
    generated API, as you and never more.
body: "## The problem\n\nA content system lives in a browser, but the people who build and operate sites live in a terminal\
  \ — and, more and more,\nso do the scripts and AI agents that work alongside them. I wanted one tool that covers the whole\
  \ life of a Nibble site:\ncreating it, running its maintenance tasks, and working on a live site's content from anywhere,\
  \ without ever becoming a\nbackdoor around the permissions the site enforces.\n\nThe README states the contract in one line:\
  \ it *\"starts a site, runs a site's tasks, and works on the content of any\nNibble site you sign in to, as you and never\
  \ as more than you.\"*\n\n## A CLI with no hard-coded commands\n\nThe usual way to build an API client is to write a command\
  \ for every endpoint and then chase the server forever. Nibble\nCLI does the opposite. Each Nibble site publishes a catalogue\
  \ of the operations it supports, described with JSON Schema,\nand `nibble remote` reads that catalogue at run time. Arguments,\
  \ validation and help are all derived from it; a typo is\nanswered with the list of arguments that *do* exist. When the\
  \ server learns a new operation, every installed CLI can use\nit the same day — *\"a new operation needs no new CLI.\"*\n\
  \nThe only coupling between the two projects is an integer: the management API version. Every response is checked against\n\
  it, and when they disagree the tool says which side needs upgrading. That is why version 0.2.0 could support API v1 and\n\
  v2 at the same time, during the window when sites were on both.\n\n## Security as the default, not a flag\n\nBecause a CLI\
  \ is often the most privileged thing on a developer's machine, most of its design is about saying no\npolitely:\n\n- **Sign-in**\
  \ uses OAuth discovery and refuses a site that doesn't offer PKCE with S256. The browser flow receives its\n  redirect on\
  \ a loopback listener bound to a random local port; a device-code flow covers servers without a browser.\n  Tokens go into\
  \ the OS keychain, falling back to a user-only file only when asked.\n- **Folders can't hijack you.** A project can name\
  \ its site in `.nibble.toml`, but an unrecognised one is refused until\n  you explicitly allow it — so cloning a repository\
  \ can never point your commands at a site you didn't choose.\n- **Tab completion is inert.** Pressing Tab *\"never contacts\
  \ the site, reads the keychain, or runs anything in the folder\n  you're in\"*; it reads only a cache that `remote` maintains.\n\
  - **Installing a site is tamper-resistant.** `nibble new` checks Ruby, Node, SQLite, libvips and ffmpeg with install\n \
  \ hints for each platform, downloads the latest release, verifies it against published checksums, gates on the required\n\
  \  Ruby and Node versions before installing anything, and works in a private `0700` folder so the release cannot be\n  swapped\
  \ between being checked and being installed.\n\nChanges made through the CLI follow the site's own rules: entry changes\
  \ are drafts until someone allowed to publish does,\nand a change left waiting for approval exits with its own status code,\
  \ distinct from failure, so scripts can tell the\ndifference.\n\n## A contract test across two repositories\n\nNibble and\
  \ its CLI are versioned and released independently, and sites run whatever version their people installed. The\nrisk with\
  \ that arrangement is a server release that quietly breaks the clients already in the wild. The guard is a\ncontract test\
  \ that boots a real Nibble checkout with a test database, mints a token, and drives the real CLI binary\nagainst it. What\
  \ makes it a real gate is *where* it runs: Nibble's own release script runs the CLI's contract test before\nit will tag\
  \ a release, *\"so a release that would break the CLI people already have is caught before it is tagged.\"*\n\n## Changing\
  \ my mind in public\n\nVersion 0.2.0 installed a site's MCP server and agent skills for the whole user account. Within a\
  \ day it was clear that\nwas the wrong scope — a site's tools should only be present where you work on that site — so 0.3.0\
  \ moved installation into\nthe current project and told existing users exactly how to migrate. The follow-up releases hardened\
  \ it further: remove\nonly what the tool itself wrote, find servers by address rather than name, refuse another Nibble site's\
  \ folder, and never\noverwrite an entry it didn't create. Reversing a decision quickly, with a migration path, is cheaper\
  \ than defending it.\n\n## Built and shipped\n\nThe CLI is around four and a half thousand lines of Rust, with unit tests\
  \ named as rules\n(`a_change_waiting_for_approval_exits_apart_from_a_failure`) and a CI script that runs formatting, Clippy\
  \ with warnings\nas errors, tests and the contract test. Releases are produced with cargo-dist for static Linux builds on\
  \ x86-64 and ARM\n(the ARM build runs on a native runner, because a cryptography dependency compiles C), macOS and Windows,\
  \ with checksums\nfor every artefact. Nibble's installer installs it automatically."
position: 2
