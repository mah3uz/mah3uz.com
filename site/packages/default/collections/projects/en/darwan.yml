seo:
  description: Darwan is a Rust and Qt theme manager for Arch Linux that safely applies 40 themes to the SDDM login screen
    and the Quickshell lock screen.
body: "## Two gates, one problem\n\n*Darwan* is Bangla for gatekeeper. Every Linux desktop has two gates: the login screen\
  \ when the machine starts and the\nlock screen when you step away. On Arch with a Wayland compositor such as Hyprland, those\
  \ are usually two different\nsystems — SDDM and a Quickshell lock — themed separately, by hand, in configuration files that\
  \ are easy to break and\nunforgiving when you do.\n\nThe themes in Darwan come from **qylock by Darkkal44**, and the credit\
  \ matters: *\"Every theme in this collection was\ndesigned and built there… Darwan only builds an app around that work.\
  \ The hard, creative part is theirs.\"* My part was\nthe engineering that makes forty very different themes safe and simple\
  \ to use on two very different hosts: a shared Rust\ncore, three interfaces on top of it, a runtime that lets one theme\
  \ run in both places, and the safety work that a login\nscreen and a lock screen demand.\n\n## One core, three faces\n\n\
  Darwan is a Rust workspace. `darwan-core` holds the theme catalogue, configuration, validation and settings with no UI\n\
  dependency at all. On top of it sit a command-line interface and a terminal UI built with ratatui (with real image\npreviews\
  \ in terminals that support them), and a desktop app written in QML on Qt 6 through cxx-qt. Because all three share\nthe\
  \ same core, *\"they behave identically.\"*\n\nThemes describe themselves. Each ships a small manifest that declares its\
  \ options — types, choices, and which options\ndepend on others — and what it supports: clock and date formats, backgrounds,\
  \ colours, fonts, motion, light and dark\nvariants. The interfaces build their forms from that manifest, so an option a\
  \ theme doesn't support is shown disabled\n*with the reason*, rather than silently doing nothing. Your choices live in one\
  \ configuration file, edited in place so\nyour comments survive, and *\"nothing inside the theme folders is ever edited.\"\
  *\n\n## Designing a lock screen that cannot lock you out\n\nA broken theme on a desktop is an annoyance. A broken lock screen\
  \ is a locked-out user, and the only fix may be a reboot or\nanother TTY. Darwan treats that as the central risk:\n\n- **A\
  \ supervisor runs the lock.** Exit codes form a small protocol — authenticated, or a dismissed screensaver. On a crash\n\
  \  the lock restarts with exponential backoff from 100 ms to two seconds; thirty stable seconds reset the failure count.\
  \ It\n  only gives up when the lock never took hold at all, because *\"a lock that never took hold protects nothing.\"*\n\
  - **There is always a way in.** If a theme fails, the user sees a plain fallback password prompt instead of a black screen.\n\
  - **It checks the compositor first.** Darwan refuses to lock unless Hyprland is configured to let a replacement locker take\n\
  \  over the session, and it sets up idle and sleep handling so the screen is locked *before* the machine suspends.\n- **You\
  \ can test without risk.** Previews run live in the app with a test password, full screen on every monitor with your\n \
  \ real password, in SDDM's own test greeter, or headless with screenshots — before anything is applied.\n\n## A root helper\
  \ with no trust in its caller\n\nWriting an SDDM theme means writing to system directories, which means root. Darwan confines\
  \ that to a small helper,\nstarted through polkit with its executable path pinned in the policy. The helper does not trust\
  \ the app that calls it:\n\n- It reads a single bounded JSON request and then the file contents from standard input — *\"\
  nothing is taken from a\n  path\"* — so it can't be pointed at files it shouldn't read.\n- It re-validates every setting\
  \ against the theme's manifest itself, checks files by their magic bytes (*\"a renamed file\n  of another kind is refused\"\
  *), and caps sizes for fonts, images and video.\n- It writes atomically, stages its symlink and swaps it in with a rename,\
  \ and refuses to touch anything that *\"exists and\n  is not darwan's symlink.\"*\n\n## The bug where SDDM ran the previous\
  \ theme\n\nOne of the more instructive bugs: after switching themes, the login screen showed the new theme's settings on\
  \ the *old*\ntheme's widgets. The cause was caching. Every packaged theme shared one modification time and one link path,\
  \ and the\ngreeter caches compiled QML by path and modification time — so it kept running the previous theme's compiled\
  \ code. The fix\nwas a link per theme, with stale links cleaned up. The broader lesson, familiar from years of operations\
  \ work, is that\ncaches key on assumptions, and a deploy that violates the assumption fails silently.\n\n## Testing forty\
  \ visual themes headlessly\n\nThemes are code, and Darwan tests them like code. `just check` loads every theme offscreen\
  \ and fails on any QML warning,\nthen types the password — including from the ambient screensaver mode — and waits for animated\
  \ submits to finish. A lint\npass enforces the rules that keep a theme fit for a screen that may run for hours: no always-running\
  \ timer faster than\n100 ms, settings that are declared must be read, colour roles must exist, and the shared theme kit\
  \ must be byte-identical\neverywhere. A `--no-fonts` mode reproduces a fresh install. There are 255 Rust tests, and the\
  \ release process — clean,\ncurrent `main`, a new version, a non-empty changelog, lint and tests on a fresh build — asks\
  \ once before anything public\nhappens.\n\n## Shipping\n\nDarwan has had eight releases, five of them in its first four\
  \ days, adding customisation for every theme (backgrounds\nfrom image, GIF, video or your desktop wallpaper; colours typed\
  \ or generated in the Material You style; fonts and motion),\na screensaver mode that becomes the lock without reloading,\
  \ multi-monitor locking and a wallpaper manager. When a\ndistribution renamed a video library and broke playback, the next\
  \ release vendored the library and added a fallback. It\nis published to the AUR as `darwan-bin` and `darwan`, under GPL-3.0,\
  \ with its site at [darwan.dev](https://darwan.dev)."
