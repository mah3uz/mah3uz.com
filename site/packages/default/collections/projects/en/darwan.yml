title: Darwan
tagline: One app to choose, configure, preview and apply themes to both of your gates — the login screen and the lock screen.
description: Darwan is a theme manager for Arch Linux that applies a collection of 40 hand-crafted themes, designed by Darkkal44
  for the qylock project, to the SDDM login screen and the Quickshell lock screen. I built the app around them — a Rust core
  with a CLI, TUI and Qt/QML interface, a lock supervisor that can't lock you out, and a root helper that trusts nothing it
  is handed.
