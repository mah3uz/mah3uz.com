title: Nibble
tagline: A schema-driven CMS you install as your own Rails application — your theme, your content, your server.
description: Nibble is a content management system that ships as a Rails 8 application you own. Content is modelled in YAML,
  edited in a fast Control Plane, rendered on the server with Vue, stored in SQLite and deployed with Kamal to a single machine.
  This site runs on it.
