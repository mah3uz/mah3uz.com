highlights:
- 25 public releases, v0.1.0 to v0.25.0, with a changelog written for the people running sites
- One SQLite database for content, cache, queue and search — no Redis, no Elasticsearch, no separate front end
- Upgrades replace one folder and refuse to run if anything inside it was edited
- AI agents work on a site through MCP as the person who connected them, never as more
- A local CI pipeline of more than a dozen steps, including security scans, server-render smoke tests and an install-and-upgrade
  rehearsal
