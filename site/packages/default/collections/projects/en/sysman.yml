title: Sysman
tagline: A system monitor for Linux that remembers — a crash-proof collector daemon and a native app to explore what happened.
description: Sysman is a Linux system monitor in Rust with three parts — a collector daemon that samples the machine every
  two seconds and keeps history in SQLite, a native GPU-accelerated app built on GPUI to explore it, and an optional, tightly
  confined helper for the readings that need root. Its first rule is that the last reading before a crash is already on disk.
