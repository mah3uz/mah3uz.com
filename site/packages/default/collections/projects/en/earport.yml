body: "## EarPort\n\n[EarPort](https://github.com/Anoryth/earport) brings Apple AirPods properly to Linux: battery levels\
  \ for each pod and the\ncase, noise control, ear detection that pauses your music, conversation awareness, and the settings\
  \ stored on the AirPods\nthemselves. A small daemon written in C talks to the AirPods over Bluetooth and publishes their\
  \ state on D-Bus; a GNOME\nShell extension shows it in Quick Settings.\n\nThat is ideal on GNOME. I use Hyprland.\n\n##\
  \ Taking it to Hyprland\n\nOn Hyprland my desktop shell is Dux Shell (DMS), built on Quickshell and extended in QML. So\
  \ I wrote\nEarPort a plugin for it, as a peer of the GNOME extension rather than a port:\n\n- **A widget in the bar** with\
  \ the AirPods' battery at a glance, and a **panel** in the control centre with a ring for\n  each pod and the case, the\
  \ noise-control modes, and the AirPods' own settings.\n- **A daemon component** that watches EarPort over D-Bus. The shell\
  \ could lose its D-Bus subscriptions, so the plugin\n  runs a signal monitor of its own and never misses an update.\n- **Settings\
  \ in the shell's own settings page.**\n\n## Making the daemon desktop-neutral\n\nThe plugin is only half of it. The daemon\
  \ had quietly assumed GNOME, so I changed what it relied on:\n\n- **Sleep detection outside GNOME.** Pausing playback when\
  \ you fall asleep needs to know whether you're using the\n  computer; the daemon now reads idle time from logind when GNOME\
  \ isn't there to ask.\n- **Installing without GNOME Shell.** The installer can now set up the daemon alone, for desktops\
  \ that use the plugin\n  instead of the extension.\n\nThe result is the same AirPods experience on a tiling Wayland desktop\
  \ as on GNOME — and the plugin kept up with Dux\nShell's move to version 2.0."
