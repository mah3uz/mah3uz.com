title: The last reading before a crash
published_at: '2026-10-24T03:00:00Z'
topics:
- topics/operations
- topics/rust
- topics/linux
excerpt: A monitor is most useful at the exact moment the machine dies — which is when most of them lose their data. Designing
  Sysman's collector around one rule, and what it took to keep that rule.
featured_image: art/posts/last-reading.svg
body:
- type: paragraph
  content:
  - type: text
    text: 'Every administrator has stood in front of a machine that has just come back from a hard reset and asked: '
  - type: text
    text: what was it doing?
    marks:
    - type: italic
  - type: text
    text: ' And almost every monitoring tool answers: '
  - type: text
    text: I don't know.
    marks:
    - type: italic
  - type: text
    text: ' The data was in memory, or in a buffer, or in a database transaction that never committed. The tool is most useful
      at precisely the moment it loses its data.'
- type: paragraph
  content:
  - type: text
    text: 'When I built Sysman, a system monitor for Linux with a collector daemon and a native app, I wrote its first rule
      before I wrote any code: '
  - type: text
    text: the last reading before a crash is on disk.
    marks:
    - type: bold
  - type: text
    text: ' Here is what it took to keep that promise, and the operational lessons that came with it.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: Write first, and sync
- type: paragraph
  content:
  - type: text
    text: 'Every two seconds, Sysman''s daemon samples the machine — CPU and temperatures, memory and pressure, sensors, GPUs,
      disks, network, processes — and appends one line of JSON to a log. Then it calls '
  - type: text
    text: fdatasync
    marks:
    - type: code
  - type: text
    text: ' and waits for the disk to confirm before it takes the next sample.'
- type: paragraph
  content:
  - type: text
    text: 'That is deliberately old-fashioned. An append-only log with a sync per record is the simplest durable structure
      there is, and it costs about 290 KB a minute. After a crash, its last lines tell a story: temperatures climbing towards
      a limit point to cooling; everything flat and normal points to the power supply; a burst of GPU errors points to the
      driver. You can read it with '
  - type: text
    text: jq
    marks:
    - type: code
  - type: text
    text: ' on a rescue system with nothing else installed.'
- type: paragraph
  content:
  - type: text
    text: 'The richer store — SQLite, with roll-ups for long-term history — is fed from the same samples but on its own thread
      with a bounded queue. If the database ever falls behind, records are dropped and '
  - type: text
    text: counted
    marks:
    - type: italic
  - type: text
    text: ', rather than allowed to delay the log. The priority is explicit in the design: '
  - type: text
    text: '"the database never delays the crash log."'
    marks:
    - type: italic
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: One failing source must not stop the others
- type: paragraph
  content:
  - type: text
    text: 'The second rule is about isolation. A system monitor reads from dozens of sources, and some of them are badly behaved:
      a sensor chip that takes too long, a filesystem that hangs, a GPU driver that blocks indefinitely. If one of those freezes
      the collector, you lose every reading — again, at the worst moment.'
- type: paragraph
  content:
  - type: text
    text: So every collector module runs on its own worker thread. Ticks are aligned to the wall clock, and each module has
      a deadline of three quarters of the interval. A module that misses it is recorded as late for that tick and its eventual
      answer is thrown away; a module still busy from last time is marked busy rather than started twice. Panics are caught.
      One broken source becomes one line in an error map, not a silent monitor.
- type: paragraph
  content:
  - type: text
    text: The hardest case was a GPU. The vendor's management library can block for a long time when the driver is unhappy
      — exactly when you want the data most. Sysman calls it on an inner thread with a one-second deadline. After the first
      hang, that thread is abandoned and the collector switches to the vendor's command-line tool, run as a child process
      that is killed if it, too, exceeds a second, with at most one outstanding. And a GPU that has powered itself down is
      never polled awake just to read its temperature.
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: A budget, measured on a modest machine
- type: paragraph
  content:
  - type: text
    text: 'A monitor that consumes noticeable resources is a monitor people uninstall. Sysman''s design document sets a footprint
      budget: every collector change is measured for CPU and memory before and after, judged '
  - type: text
    text: '"for a modest laptop rather than for the machine it was measured on."'
    marks:
    - type: italic
- type: paragraph
  content:
  - type: text
    text: 'The budget earned its keep immediately:'
- type: bulletList
  content:
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: A family of motherboard sensor chips turned out to be read over port I/O so expensively that polling them every
          two seconds cost about 4.6% of a CPU core on its own. Those chips are now read every ten seconds by default.
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Following the system journal originally used around 120 MB of memory. Reopening only the journal files that
          were actually growing brought it down to about 7 MB.
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Work that scales with the number of processes is done once per process, not once per tick — a process's parent
          and cgroup are recorded when it is first seen.
- type: paragraph
  content:
  - type: text
    text: The reference figure is about 2.6% of one core, 85 MB of memory and 23 threads on a 32-thread desktop running around
      700 processes.
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: Honest data
- type: paragraph
  content:
  - type: text
    text: 'A monitor''s job is to tell the truth, including about its own limits. Values that need root are shown as '
  - type: text
    text: not permitted
    marks:
    - type: italic
  - type: text
    text: ', never as a misleading zero. A configuration typo stops the daemon rather than silently disabling a collector.
      And when Sysman explains '
  - type: text
    text: why
    marks:
    - type: italic
  - type: text
    text: ' a process is running — a service, a timer, a login item, a container — the rule is '
  - type: text
    text: '"facts only: every cause names its evidence, and what cannot be known is said."'
    marks:
    - type: italic
- type: paragraph
  content:
  - type: text
    text: 'Identity gets the same care. A process is identified by its PID '
  - type: text
    text: and
    marks:
    - type: italic
  - type: text
    text: ' its start time, because PIDs are reused and merging two different processes into one history is exactly the kind
      of quiet lie that sends an investigation in the wrong direction. Devices are keyed by stable identifiers rather than
      by their position in a list, so adding a disk doesn''t scramble a year of charts.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: What carries over
- type: paragraph
  content:
  - type: text
    text: 'None of this is specific to monitoring. The same principles apply to any system you''ll need to understand after
      it fails:'
- type: orderedList
  attrs:
    start: 1
  content:
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Decide what must survive, and write it first
        marks:
        - type: bold
      - type: text
        text: ' — durably, simply, before anything that could delay it.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Isolate sources of failure
        marks:
        - type: bold
      - type: text
        text: ' so one bad component degrades the system instead of stopping it.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Give every external call a deadline
        marks:
        - type: bold
      - type: text
        text: ', and a plan for when it misses one.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Measure your own footprint
        marks:
        - type: bold
      - type: text
        text: ' on the smallest machine you support.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Never present a guess as a fact.
        marks:
        - type: bold
- type: paragraph
  content:
  - type: text
    text: After seventeen years of diagnosing other people's outages, I'm convinced the most valuable feature of any system
      is that it can tell you, afterwards, what happened.
