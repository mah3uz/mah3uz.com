title: Designing software that strangers can upgrade
published_at: '2026-10-13T09:00:00Z'
topics:
- topics/engineering
- topics/operations
excerpt: Anything a released version reads at runtime is a contract with the future. What Nibble taught me about upgrades
  — a release that can't know its own future address, why merging git history was the wrong model, and checksums that refuse
  to destroy your edits.
art: /art/posts/strangers-can-upgrade.svg
body:
- type: paragraph
  content:
  - type: text
    text: 'For most of my career I have been on the receiving end of upgrades, as the person who applies them to servers and
      keeps the sites on them running — and anyone in that seat knows the kinds that hurt: the new version that quietly overwrites
      a customised file, the package that moves its configuration and leaves the old one behind, the "simple" upgrade that
      is only simple because a backup existed. Building Nibble put me on the other side. Once other people run your software,
      every release has to be upgradable by someone you will never meet, on a server you will never see.'
- type: paragraph
  content:
  - type: text
    text: Three lessons, each learned the slightly hard way.
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: A release can't know its own future
- type: paragraph
  content:
  - type: text
    text: Nibble's Control Plane has an Updates screen that shows the release a site runs and the notes for anything newer.
      At first it read those notes from a raw file in a git repository. That worked until the day the repository needed to
      move — and then I hit the part that caught me out.
- type: paragraph
  content:
  - type: text
    text: 'The upgrade command reads where to fetch releases from out of '
  - type: text
    text: the version a site already has
    marks:
    - type: bold
  - type: text
    text: '. So the release that brings in a new address is still fetched from the old one, because it''s the old release
      doing the asking. There is no clever fix: a release only knows the world as it was when it was cut. The honest answer
      was an upgrade note that says it plainly — run this one upgrade with the new address spelled out — and an address on
      nibble.ink that I control and can keep serving wherever the code lives.'
- type: paragraph
  content:
  - type: text
    text: 'The rule I wrote down so I wouldn''t relearn it: '
  - type: text
    text: anything a released version reads at runtime is a contract with the future.
    marks:
    - type: bold
  - type: text
    text: ' Update servers, feed URLs, API endpoints, the paths a daemon looks for its configuration. Choose them as if they
      have to last forever, because for somebody''s install, they do.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: Upgrading shouldn't require reading my commit log
- type: paragraph
  content:
  - type: text
    text: 'Until version 0.16.0, a Nibble site was a clone of Nibble''s repository, and upgrading meant merging newer tags
      into it. It worked in the way things work until the day they don''t. Every site''s repository carried our whole history,
      and every upgrade was a merge between two parties editing some of the same files. When a conflict happened, the site''s
      owner had to understand '
  - type: text
    text: my
    marks:
    - type: italic
  - type: text
    text: ' changes to resolve '
  - type: text
    text: theirs
    marks:
    - type: italic
  - type: text
    text: . That's backwards.
- type: paragraph
  content:
  - type: text
    text: 'So everything of Nibble''s moved into one folder, '
  - type: text
    text: vendor/nibble
    marks:
    - type: code
  - type: text
    text: ', with a rule simple enough for a sticker: everything under that folder is Nibble''s; everything else is yours.
      A release became an archive of that folder with a checksum beside it, and an upgrade became: snapshot the database,
      replace the folder, keep the previous release in case you want it back.'
- type: paragraph
  content:
  - type: text
    text: The best part of that release was deleting code. All the git machinery that made merges bearable went away.
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: Never throw away what someone changed
- type: paragraph
  content:
  - type: text
    text: 'Replacing a folder is only safe if you know what the site changed. Two mechanisms make it so:'
- type: bulletList
  content:
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: A checksum for every file.
        marks:
        - type: bold
      - type: text
        text: ' Each release lists every file it ships, with its checksum. If a site edited one of Nibble''s files in place,
          the upgrade notices and '
      - type: text
        text: refuses
        marks:
        - type: bold
      - type: text
        text: ', instead of quietly discarding the edit. Refusing loudly is annoying for a minute. Discarding someone''s work
          silently is a betrayal they discover a month later.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Templates are offered, never imposed.
        marks:
        - type: bold
      - type: text
        text: ' The files a site owns — its Dockerfile, its settings — were written from Nibble''s templates at install time.
          When a template moves on, the upgrade shows the difference and offers it, but never overwrites the site''s copy.'
- type: paragraph
  content:
  - type: text
    text: 'This is the same discipline I''ve always wanted from Linux packages: a package manager that leaves your edited
      configuration alone and puts its new version beside it is one you can trust on a production machine.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: The checklist I use now
- type: bulletList
  content:
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Every runtime address is permanent.
        marks:
        - type: bold
      - type: text
        text: ' If it might move, put it behind a name you control first.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: One owner per file.
        marks:
        - type: bold
      - type: text
        text: ' Mine, or yours — never both. Shared files are where upgrades go to die.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Verify before replacing.
        marks:
        - type: bold
      - type: text
        text: ' Checksums, then a backup, then the change, then a way back.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Refuse, don't guess.
        marks:
        - type: bold
      - type: text
        text: ' When the upgrade finds something it doesn''t understand, it stops and says what it found.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Upgrade notes are part of the release.
        marks:
        - type: bold
      - type: text
        text: ' If a step can''t be automated, say so in plain words, once, where people will read it.'
- type: paragraph
  content:
  - type: text
    text: 'The original posts: '
  - type: text
    text: Giving the project an address it can keep
    marks:
    - type: link
      attrs:
        href: https://nibble.ink/blog/giving-the-project-an-address-it-can-keep
  - type: text
    text: ' and '
  - type: text
    text: One folder you can throw away and replace
    marks:
    - type: link
      attrs:
        href: https://nibble.ink/blog/one-folder-you-can-throw-away-and-replace
  - type: text
    text: .
