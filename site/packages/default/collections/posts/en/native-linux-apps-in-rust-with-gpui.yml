title: Native Linux apps in Rust with GPUI
published_at: '2026-09-20T09:00:00Z'
topics:
- topics/rust
- topics/linux
excerpt: Notes from building Sysman on GPUI, the GPU-accelerated UI framework behind the Zed editor.
photo: https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1800&q=80
photo_credit: 'Photo: Unsplash'
art: /art/sysman.svg
body:
- type: paragraph
  content:
  - type: text
    text: 'When I started '
  - type: text
    text: Sysman
    marks:
    - type: link
      attrs:
        href: /projects/sysman
  - type: text
    text: ', a system monitor that remembers history, I wanted the app to feel instant even when scrubbing through hours of
      samples. That ruled out a web view. It led me to '
  - type: text
    text: GPUI
    marks:
    - type: bold
  - type: text
    text: ', the UI framework the Zed team built for their editor.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: Why GPUI
- type: paragraph
  content:
  - type: text
    text: GPUI renders on the GPU and is written in Rust from top to bottom. Layout, text and drawing happen in the same language
      as the rest of the application, so there is no bridge to cross and no second runtime to ship.
- type: bulletList
  content:
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Rendering on the GPU
        marks:
        - type: bold
      - type: text
        text: ' keeps dense charts smooth.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: One language
        marks:
        - type: bold
      - type: text
        text: ' for the collector, the storage and the interface.'
  - type: listItem
    content:
    - type: paragraph
      content:
      - type: text
        text: Ownership rules
        marks:
        - type: bold
      - type: text
        text: ' make state changes explicit, which is exactly what a live dashboard needs.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: Splitting the work
- type: paragraph
  content:
  - type: text
    text: 'Sysman is two programs. A small '
  - type: text
    text: collector daemon
    marks:
    - type: bold
  - type: text
    text: ' samples the system and stores history; the '
  - type: text
    text: app
    marks:
    - type: bold
  - type: text
    text: ' reads that history and draws it. Keeping them apart means the collector stays tiny and always-on, while the app
      can be as rich as it likes and only runs when you open it.'
- type: heading
  attrs:
    level: 2
  content:
  - type: text
    text: What I'd tell someone starting out
- type: paragraph
  content:
  - type: text
    text: GPUI is young and moving quickly, so read the source as much as the docs — Zed itself is the best example application.
      Start with one view, get the data flowing, and only then make it pretty. The speed you get for free is remarkable.
