seo:
  title: About
  description: About Mahfuz Shaikh — software engineer and Linux systems administrator since 2009, building products and running
    production infrastructure.
content: "I'm **Mahfuz Shaikh**, known online as **mah3uz**. For more than seventeen years I have worked on both sides of\
  \ the line\nthat many organisations draw between *building* software and *running* it. I write applications, and I administer\
  \ the\nLinux servers and infrastructure they depend on — provisioning machines, managing configuration, automating deployments,\n\
  securing and patching systems, and keeping production healthy long after launch day.\n\nI started out in 2009 as a freelancer\
  \ on oDesk, now Upwork, and spent five years there taking on development and server\nwork for clients I knew only through\
  \ the platform. That is where I learned that the job isn't finished until the client\ncan understand what was done and the\
  \ next person can maintain it.\n\nLinux has been my operating system since I first started using computers. That shaped\
  \ how I work: I would rather\nunderstand the whole system than one layer of it, and I am most at home in a terminal, reading\
  \ logs and source code until\nthe behaviour makes sense.\n\n## What that combination is good for\n\nThe most expensive problems\
  \ I have solved lived in the gap between application and infrastructure: the slow page that was\nreally a database configuration,\
  \ the failed deploy that was really a full disk, the intermittent error that was really a\nDNS cache, the \"random\" restart\
  \ that was really a memory limit. When the same person understands the code *and* the\nmachine, those gaps close quickly\
  \ — and, more importantly, the next system gets designed so they don't open at all.\n\nIt also changes how I write software.\
  \ I build things that are pleasant to operate: they fail loudly and safely, log what an\non-call engineer needs, start and\
  \ stop cleanly, back themselves up, and upgrade without drama. You can see that in the\nproducts I build today — a CMS whose\
  \ upgrades refuse to run over modified files, a system monitor whose first rule is that\nthe last reading before a crash\
  \ is already on disk, a lock-screen manager designed so it can never lock you out.\n\n## What I do\n\n- **Software engineering**\
  \ — web applications and APIs, back ends and front ends, command-line tools and desktop software;\n  from architecture and\
  \ data modelling to the last detail of the interface. Ruby and Rails, Rust, Python, TypeScript and\n  Vue, and whatever\
  \ a problem actually needs.\n- **Linux systems administration** — building and maintaining servers, users and permissions,\
  \ services and their\n  configuration, storage, networking and VPNs, monitoring and logging, security hardening, patching,\
  \ backups and recovery.\n- **DevOps and delivery** — containerised applications, repeatable deployments, CI and release\
  \ automation, staging\n  environments that tell the truth, and production operations.\n- **Self-hosting and homelab** —\
  \ an extensive homelab of my own: virtualisation on bare metal, private networking, and\n  running the services a team depends\
  \ on without handing them to someone else. It is where new infrastructure gets tried\n  before it goes anywhere near a client.\n\
  \n## How I work\n\nI like small, frequent releases, written changelogs and runbooks, and automation that anyone on the team\
  \ can run. I would\nrather spend an afternoon making a failure mode safe than a week hoping it doesn't happen. I keep things\
  \ simple on\npurpose, and I take security seriously by default rather than as a phase at the end.\n\n## Working together\n\
  \nThrough my company, **mah3uz – IT Consultancy**, I take on a limited amount of client work alongside my own products —\
  \ engineering, infrastructure, or the place where the\ntwo meet. If you have a platform that needs to be built carefully\
  \ *and* run reliably, [tell me about it](#contact)."
