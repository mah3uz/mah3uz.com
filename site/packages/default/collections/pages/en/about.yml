title: Software engineer. Systems administrator. Both, for seventeen years.
template: about
eyebrow: About
intro: I build software and I run the infrastructure it lives on. Since 2009 I've done both professionally — and Linux has
  been my operating system for as long as I've been using computers at all.
art: /art/pages/about.svg
cards:
- title: Build like you'll be paged for it
  text: Most of what goes wrong in production was decided at a desk months earlier. I design software with the operator in
    mind — clear failure modes, honest logs, safe defaults — because the operator is often me.
- title: Boring foundations, careful details
  text: Proven technology — Linux, PostgreSQL, SQLite, Rails, plain HTML — leaves room to spend effort where it shows. The
    craft is in the details people touch every day.
- title: Automate the second time
  text: Do it by hand once to understand it. Write it down the second time. Automate it the third. Deploys, backups and server
    builds should be repeatable by anyone, including future me at 3am.
- title: Refuse rather than corrupt
  text: A release script that checks everything before it does anything public. A daemon that stops on a configuration typo
    instead of silently disabling something. Loud and safe beats quiet and wrong.
- title: Security is a default, not a feature
  text: Least privilege, private sockets, signed releases, secrets kept out of logs and history. The secure path should be
    the path of least resistance.
- title: Write it down
  text: Changelogs for the people running the system, runbooks for the people fixing it, documentation for the people using
    it. Software nobody can operate isn't finished.
milestones:
- year: Day one
  tag: Linux
  title: Linux from the start
  text: Linux has been my operating system since I first sat down at a computer. It shaped everything that followed — a habit
    of reading the source, living in a terminal, and wanting to understand the whole system rather than one layer of it.
- year: '2009'
  tag: Freelance
  title: Freelancing on oDesk, now Upwork
  text: From 2009 to 2014 I worked as an independent contractor on oDesk (Upwork, as it became), on both sides from the start
    — building web applications for clients, and installing, configuring and maintaining the Linux servers they ran on. Five
    years of scoping, delivering and supporting work for clients I met only online taught me to communicate plainly and leave
    every system documented.
- year: '2013'
  tag: Open source
  title: A public footprint on GitHub
  text: My first public repository. Most professional work — for clients and employers — is private, so the public record
    from here on is a partial one.
  url: https://github.com/mah3uz
- year: '2014'
  tag: Consultancy
  title: mah3uz – IT Consultancy
  text: After five years of freelancing I founded my own company, mah3uz – IT Consultancy, which I still run today — software
