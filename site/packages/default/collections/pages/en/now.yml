seo:
  title: Now
  description: What Mahfuz Shaikh is focused on now — building Nibble, operating client platforms, shipping Linux tools, and
    learning GPUI and eBPF.
content: "## Building\n\nMost of my product time goes into **Nibble**. The goal for the next stretch is a 1.0 that deserves\
  \ the name: a smaller set\nof guarantees I am prepared to keep for years, an upgrade path people can trust without reading\
  \ every changelog, and the\nfirst sites installed and run by people other than me. Its companion, **Nibble CLI**, is where\
  \ much of the day-to-day\nexperience lives — creating sites, running their tasks, and working on content from a terminal\
  \ or an AI agent, always as\nthe person who signed in.\n\n## Operating\n\nAlongside my own work I run production systems:\
  \ client platforms, and the infrastructure behind this site and my products.\nThat means the unglamorous, essential work\
  \ — patching and upgrades, backups that are tested by restoring them, monitoring\nthat alerts on what matters, and deploys\
  \ small enough to be boring. I'm particularly interested right now in making\nsingle-server deployments with Kamal as dependable\
  \ as much larger setups, because for most applications one well-run\nmachine is the right answer.\n\n## Shipping\n\n- **Sysman**\
  \ — alerts in the collector daemon are next, so a machine can tell you about a problem rather than waiting to be\n  asked.\n\
  - **Darwan** — continuing the wallpaper manager and screensaver work, and keeping pace with the Wayland compositors it\n\
  \  supports.\n- **Quarry** and **Insensical** — point releases driven by daily use; the best feature requests come from\
  \ the tool getting in\n  my own way.\n\n## Learning\n\nGPUI, the GPU-accelerated UI framework from the Zed editor, for native\
  \ Linux software that feels instant; eBPF and BTF for\nobservability that works across kernel versions; and, through rrussat,\
  \ the practical details of applied cryptography —\nwhere the hard part is never the algorithm, but the state machine around\
  \ it.\n\n## Not doing\n\nTaking on new long-term commitments. I keep some room for focused engagements where engineering\
  \ and infrastructure meet —\n[get in touch](/about#contact) if you have one in mind."
