title: The tools I use every day
template: uses
eyebrow: Uses
intro: The hardware and software behind my work — for building, for running servers, for the homelab, and for living on the
  Linux desktop. Several of these I built because I wanted them to exist.
featured_image: art/pages/uses.svg
tools:
- group: Hardware
  name: Workstation — Ryzen 9 7950X3D
  key: PC
  note: 16 cores and 32 threads, a GeForce RTX 4090 and 128 GB of memory, running Arch Linux on 2 TB of btrfs. Big builds
    and virtual machines without waiting.
- group: Hardware
  name: 27-inch 1440p display
  key: '27'
  note: 2560×1440 at 120 Hz — sharp enough for text all day, fast enough that scrolling feels right.
- group: Hardware
  name: MacBook Pro M1
  key: MB
  note: For work away from the desk, and for building and testing the macOS side of my tools.
- group: Hardware
  name: Keychron K4
  key: K4
  note: A compact 96% mechanical keyboard that switches between the workstation and the MacBook.
  url: https://www.keychron.com
- group: Hardware
  name: Logitech MX Master 3
  key: MX
  note: The mouse for long days; the free-spinning wheel earns its keep in long logs.
  url: https://www.logitech.com
- group: Desktop
  name: Arch Linux
  note: A rolling base I understand top to bottom, and the distribution I ship packages for.
  url: https://archlinux.org
- group: Desktop
  name: Hyprland
  note: 'A tiling Wayland compositor: fast, scriptable, and out of the way.'
  url: https://hyprland.org
- group: Desktop
  name: Omarchy
  note: An opinionated Arch and Hyprland setup I follow and adapt.
  url: https://omarchy.org
- group: Desktop
  name: Walker
  note: 'The application launcher: fast, keyboard-first and easy to extend.'
  url: https://github.com/abenz1267/walker
- group: Desktop
  name: Darwan
  note: Themes for my login and lock screens.
  url: /projects/darwan
  mine: true
- group: Desktop
  name: Sysman
  note: Watching my own machine — and remembering what it did.
  url: /projects/sysman
  mine: true
- group: Terminal
  name: Neovim
  note: My editor for almost everything, configured with AstroNvim for a polyglot week.
  url: https://neovim.io
- group: Terminal
  name: Ghostty
  note: A fast, native terminal emulator with excellent defaults.
  url: https://ghostty.org
- group: Terminal
  name: Insensical
  note: My multiplexer for long-running work and parallel coding agents.
  url: /projects/insensical
  mine: true
- group: Terminal
  name: tmux
  note: Still on every server I administer, because it is always there.
  url: https://github.com/tmux/tmux
- group: Terminal
  name: Quarry
  note: My SQL client for PostgreSQL, MySQL, MariaDB and SQLite.
  url: /projects/quarry
  mine: true
- group: Terminal
  name: just
  note: Every project's commands in one readable file — checks, releases, packaging.
- group: Languages
  name: Rust
  note: For tools, daemons and desktop software that must be fast and dependable.
- group: Languages
  name: Ruby
  note: For products, and for the sheer productivity of Rails.
- group: Languages
  name: TypeScript
  note: For the browser, typed end to end — from the schema to the view.
- group: Languages
  name: Python
  note: For automation, scripts and generating things — this site's artwork included.
- group: Languages
  name: Bash
  note: The glue of every server, written carefully.
- group: Languages
  name: QML
  note: For Qt interfaces on the Linux desktop.
- group: Frameworks
  name: Ruby on Rails 8
  note: The backbone of Nibble — Solid Queue, Solid Cache and SQLite included.
  url: https://rubyonrails.org
- group: Frameworks
  name: Vue 3 and Inertia
  note: Server-rendered pages that behave like an app once loaded.
- group: Frameworks
  name: Tailwind CSS
  note: Design tokens in code, as this site shows.
- group: Frameworks
  name: ratatui
  note: Terminal interfaces in Rust — Quarry, Darwan and rrussat.
- group: Frameworks
  name: GPUI
  note: GPU-accelerated native UI in Rust, used by Sysman.
- group: Servers & ops
  name: Kamal
  note: Zero-downtime deploys of containers to plain servers — including this site.
  url: https://kamal-deploy.org
- group: Servers & ops
  name: Docker
  note: Packaging applications so production is the same everywhere.
- group: Servers & ops
  name: systemd
  note: Services, timers, sandboxing and the journal — far more capable than it gets credit for.
- group: Servers & ops
  name: Ansible
  note: Configuration as code for fleets of servers.
- group: Servers & ops
  name: OpenSSH
  note: Keys, jump hosts and tunnels — the most important tool on every server.
- group: Servers & ops
  name: Matrix
  note: Self-hosted chat, with its sticker tooling.
  url: https://matrix.org
- group: Servers & ops
  name: Umami
  note: Analytics without tracking, self-hosted.
  url: https://umami.is
- group: Homelab
  name: Proxmox VE
  key: PX
  note: One node runs the whole lab as LXC containers and virtual machines, new ones cloned from an Ubuntu 24.04 template.
  url: https://www.proxmox.com
- group: Homelab
  name: AdGuard Home
  key: AG
  note: DNS for the whole network, with ads and trackers filtered out before they reach a device.
  url: https://adguard.com/adguard-home/overview.html
- group: Homelab
  name: NPMplus
  key: NP
  note: The reverse proxy in front of every service, terminating TLS.
  url: https://github.com/ZoeyVid/NPMplus
- group: Homelab
  name: Authentik
  key: AU
  note: 'Single sign-on for the lab: one identity, one login, every service behind it.'
  url: https://goauthentik.io
- group: Homelab
  name: Gitea
  key: GT
  note: My own Git server, for what doesn't belong on GitHub.
  url: https://about.gitea.com
- group: Homelab
  name: SearXNG
  key: SX
  note: 'Private metasearch: results from many engines, with nothing about me sent to any of them.'
  url: https://docs.searxng.org
- group: Homelab
  name: Pangolin and Headscale
  key: PH
  note: Reaching the lab from outside without opening a port — tunnelled through Pangolin and Newt, or over a self-hosted
    Tailscale network.
  url: https://github.com/fosrl/pangolin
- group: Homelab
  name: WireGuard
  key: WG
  note: One private network across the homelab, my servers and my laptop.
  url: https://www.wireguard.com
- group: Homelab
  name: umbrelOS
  key: UM
  note: A home-server OS for one-click apps, in a virtual machine of its own.
  url: https://umbrel.com
- group: Homelab
  name: An agents VM
  key: AI
  note: Coding agents get a virtual machine of their own, kept apart from everything else on the lab.
- group: Data
  name: PostgreSQL
  note: When many writers need one database.
- group: Data
  name: SQLite
  note: For far more than people expect — this site, Nibble and Sysman all run on it.
- group: Data
  name: MySQL & MariaDB
  note: Still behind a great deal of the web I look after.
- group: Data
  name: Object storage
  note: Off-site backups and uploads, kept separate from the server that makes them.
- group: Shipping
  name: Git & GitHub
  note: Every change reviewed, every release tagged.
- group: Shipping
  name: AUR
  note: How my Linux tools reach Arch users.
- group: Shipping
  name: Homebrew
  note: How Quarry and Insensical reach macOS.
  url: https://github.com/mah3uz/homebrew-tap
- group: Shipping
  name: Cloudflare
  note: Static sites and documentation at the edge.
seo:
  title: Uses
  description: The hardware and software Mahfuz Shaikh uses for development, Linux systems administration, the homelab and
    the desktop — from a Ryzen workstation, Arch and Neovim to Kamal, Proxmox and self-built tools.
