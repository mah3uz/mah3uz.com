schema: 1
title: Page
tabs:
  main:
    display: Content
    sections:
      - fields:
          - handle: title
            field: { type: text, required: true, listable: true, localizable: true, validate: [max:200] }
          - handle: eyebrow
            field: { type: text, instructions: 'Small line shown above the heading.', localizable: true }
          - handle: intro
            field: { type: textarea, character_limit: 400, localizable: true }
          - handle: content
            field:
              type: markdown
              display: Text
              instructions: The page's main text, in Markdown. Shown before any blocks.
              localizable: true
          - handle: blocks
            field: nibble::page_fields.blocks
            config:
              add_sets:
                content:
                  latest_posts:
                    display: Latest posts
                    icon: layout-list
                    fields:
                      - handle: count
                        field: { type: integer, min: 1, max: 12, default: 3 }
                      - handle: heading
                        field: { type: text }
  extras:
    display: Extras
    sections:
      - display: Cards
        instructions: Short titled points — principles on About, focus areas on Now.
        fields:
          - handle: cards
            field:
              type: grid
              mode: stacked
              add_row: Add card
              localizable: true
              fields:
                - handle: title
                  field: { type: text, required: true }
                - handle: text
                  field: { type: textarea, required: true }
      - display: Artwork
        fields:
          - handle: art
            field: { type: text, instructions: "The page's banner artwork, such as /art/pages/about.svg." }
      - display: Tools
        instructions: For Uses — every tool, grouped. Shown as a desk of tiles.
        fields:
          - handle: tools
            field:
              type: grid
              mode: table
              add_row: Add tool
              localizable: true
              fields:
                - handle: group
                  field: { type: text, required: true, width: 25 }
                - handle: name
                  field: { type: text, required: true, width: 25 }
                - handle: note
                  field: { type: textarea, width: 50 }
                - handle: url
                  field: { type: text, instructions: 'A web address, or a path on this site such as /projects/quarry.' }
                - handle: mine
                  field: { type: toggle, instructions: 'Something I built.' }
                - handle: key
                  field: { type: text, character_limit: 3, instructions: 'What its keycap shows, e.g. K4. Leave empty for the initials of its name.' }
      - display: Milestones
        instructions: For About — the timeline, oldest first.
        fields:
          - handle: milestones
            field:
              type: grid
              mode: stacked
              add_row: Add milestone
              localizable: true
              fields:
                - handle: year
                  field: { type: text, required: true, width: 25 }
                - handle: tag
                  field: { type: text, width: 25, instructions: 'A short label, e.g. Product, Open source, Learning.' }
                - handle: title
                  field: { type: text, required: true, width: 50 }
                - handle: text
                  field: { type: textarea, required: true }
                - handle: url
                  field: { type: text, instructions: 'A web address, or a path on this site such as /projects/quarry.' }
  seo:
    display: SEO
    sections:
      - fields:
          - import: nibble::seo
