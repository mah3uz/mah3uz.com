schema: 1
title: Post
tabs:
  main:
    display: Content
    sections:
      - fields:
          - import: nibble::post_fields
  sidebar:
    display: Sidebar
    sections:
      - fields:
          - handle: topics
            field: { type: terms, taxonomies: [topics], listable: true }
          - import: nibble::featured_image
          - handle: art
            field:
              type: text
              instructions: 'The post banner artwork, such as /art/posts/sqlite-is-enough.svg.'
  seo:
    display: SEO
    sections:
      - fields:
          - import: nibble::seo
