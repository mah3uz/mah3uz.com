<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">What GPUI gives you, and what you build</text><rect x="110" y="200" width="430" height="360" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="140" y="254" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#62EDD4">Insensical</text><path d="M110 282H540" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="140" y="340" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">grid renderer</text><text x="140" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">glyph cache</text><text x="140" y="444" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">row cache</text><text x="140" y="496" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">box-drawing as geometry</text><rect x="570" y="200" width="430" height="360" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="600" y="254" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#62EDD4">easyshot</text><path d="M570 282H1000" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="600" y="340" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">layer-shell surfaces</text><text x="600" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">tiny-skia renderer</text><text x="600" y="444" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">custom cursors</text><rect x="1030" y="200" width="430" height="360" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="1060" y="254" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#62EDD4">Sysman</text><path d="M1030 282H1460" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="1060" y="340" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">charts</text><text x="1060" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">time-series scrubbing</text><rect x="110" y="590" width="1350" height="140" rx="24" fill="#21BDB0" fill-opacity="0.22" stroke="#62EDD4" stroke-opacity="0.7" stroke-width="2"/><text x="785.0" y="652" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#E9F7F7">GPUI: quads · paths · shaped text · glyphs · images</text><text x="785.0" y="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" text-anchor="middle" fill="#A6D3D6">no custom shaders, pipelines or textures</text>
