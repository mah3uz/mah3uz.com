<text x="110" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#E9F7F7">One profile per job</text><rect x="110" y="240" width="324" height="370" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="138" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" font-weight="700" fill="#62EDD4">dev</text><path d="M110 336H434" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="138" y="396" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">line tables only</text><text x="138" y="448" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">deps: opt-level 2</text><text x="138" y="500" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">deps: no debug info</text><rect x="462" y="240" width="324" height="370" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="490" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" font-weight="700" fill="#62EDD4">dbg</text><path d="M462 336H786" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="490" y="396" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">inherits dev</text><text x="490" y="448" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">full debug info,</text><text x="490" y="500" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">when you need</text><text x="490" y="552" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">a debugger</text><rect x="814" y="240" width="324" height="370" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="842" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" font-weight="700" fill="#62EDD4">page/fast</text><path d="M814 336H1138" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="842" y="396" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">inherits release</text><text x="842" y="448" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">no LTO</text><text x="842" y="500" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">16 codegen units</text><text x="842" y="552" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">36 s vs 126 s</text><rect x="1166" y="240" width="324" height="370" rx="22" fill="#0E2B33" stroke="#62EDD4" stroke-opacity="0.35" stroke-width="2"/><text x="1194" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" font-weight="700" fill="#62EDD4">release</text><path d="M1166 336H1490" stroke="#62EDD4" stroke-opacity="0.2" stroke-width="2"/><text x="1194" y="396" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#E9F7F7">thin LTO</text><text x="1194" y="448" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">1 codegen unit</text><text x="1194" y="500" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A6D3D6">stripped</text><text x="1194" y="552" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" font-weight="700" fill="#E9F7F7">70 <tspan font-family="Inter, ui-sans-serif, system-ui, sans-serif">→</tspan> 50 MB</text>
